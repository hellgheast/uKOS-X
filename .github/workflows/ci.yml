name: uKOS-X CI
run-name: uKOS-X CI
on: [push]
permissions:
  contents: read
  packages: read
env:
  # Equivalent to CI_PROJECT_DIR in GitLab — set per-job via $GITHUB_WORKSPACE
  # PATH_GCC_CORTEXM: path inside the Docker image (symlink created by Dockerfile)
  PATH_GCC_ARM: /opt/uKOS/cross/gcc_arm
  PATH_GCC_RVXX: /opt/uKOS/cross/gcc_riscv
  IMAGE: ghcr.io/hellgheast/ukosx_tools:latest

jobs:

  login:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # ── Build: third-party libraries ────────────────────────────────────────────
  build-third-parties:
    runs-on: ubuntu-latest
    needs: login
    container:
      image: ghcr.io/hellgheast/ukosx_tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build TinyUSB
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/TinyUSB"
          zsh build.sh

      - name: Build MicroPython
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/MicroPython"
          zsh build.sh

      - name: Build LVGL
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/LVGL"
          zsh build.sh

      - name: Build FatFs
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/FatFs"
          zsh build.sh

      - name: Upload third-party libraries
        uses: actions/upload-artifact@v4
        with:
          name: third-party-libs
          path: Third_Parties/

  # ── Build: Alastor H743 ─────────────────────────────────────────────────────
  # Equivalent to build:alastor_743
  build-alastor-743:
    runs-on: ubuntu-latest
    needs: [login, build-third-parties]
    container:
      image: ghcr.io/hellgheast/ukosx_tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BOARD: Alastor_H743
      VARIANT: Variant_Test
    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download third-party libraries
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: Third_Parties/

      - name: Build firmware
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          export PATH="$PATH:$PATH_GCC_ARM/bin"
          make -C "$PATH_UKOS_X_PACKAGE/Ports/Targets/$BOARD/$VARIANT/System" \
               -j6 WITH_TINYUSB=n WITH_MICROPYTHON=n

      # Equivalent to GitLab artifacts: paths:
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alastor-h743-firmware
          path: |
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.elf
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.hex
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.bin
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.map

  # ── Build: all targets ──────────────────────────────────────────────────────
  # Equivalent to build:build_all
  build-all:
    runs-on: ubuntu-latest
    needs: [login, build-third-parties]
    container:
      image: ghcr.io/${{ github.repository_owner }}/ukosx_tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fix git safe directory
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download third-party libraries
        uses: actions/download-artifact@v4
        with:
          name: third-party-libs
          path: Third_Parties/

      - name: Build all targets
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          export PATH="$PATH:$PATH_GCC_ARM/bin:$PATH_GCC_RVXX/bin"
          cd "$PATH_UKOS_X_PACKAGE/Ports/Targets"
          ./build.sh -v

      - name: Upload firmware artifacts (Alastor_H743)
        uses: actions/upload-artifact@v4
        with:
          name: alastor-h743-all-firmware
          path: Ports/Targets/Alastor_H743/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Discovery_U5G9)
        uses: actions/upload-artifact@v4
        with:
          name: discovery-u5g9-firmware
          path: Ports/Targets/Discovery_U5G9/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Nucleo_F207)
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-f207-firmware
          path: Ports/Targets/Nucleo_F207/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Nucleo_H743)
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-h743-firmware
          path: Ports/Targets/Nucleo_H743/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Nucleo_L4R5)
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-l4r5-firmware
          path: Ports/Targets/Nucleo_L4R5/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Nucleo_N657)
        uses: actions/upload-artifact@v4
        with:
          name: nucleo-n657-firmware
          path: Ports/Targets/Nucleo_N657/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Longan_Nano_F103)
        uses: actions/upload-artifact@v4
        with:
          name: longan-nano-f103-firmware
          path: Ports/Targets/Longan_Nano_F103/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Firefly_H743)
        uses: actions/upload-artifact@v4
        with:
          name: firefly-h743-firmware
          path: Ports/Targets/Firefly_H743/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Asmodee_H747 CM4)
        uses: actions/upload-artifact@v4
        with:
          name: asmodee-h747-cm4-firmware
          path: Ports/Targets/Asmodee_H747/Variant_Test_CM4/System/FLASH.*

      - name: Upload firmware artifacts (Asmodee_H747 CM7)
        uses: actions/upload-artifact@v4
        with:
          name: asmodee-h747-cm7-firmware
          path: Ports/Targets/Asmodee_H747/Variant_Test_CM7/System/FLASH.*

      - name: Upload firmware artifacts (DevKit_nRF5340 Net)
        uses: actions/upload-artifact@v4
        with:
          name: devkit-nrf5340-net-firmware
          path: Ports/Targets/DevKit_nRF5340/Variant_Test_Net/System/FLASH.*

      - name: Upload firmware artifacts (DevKit_nRF5340 App)
        uses: actions/upload-artifact@v4
        with:
          name: devkit-nrf5340-app-firmware
          path: Ports/Targets/DevKit_nRF5340/Variant_Test_App/System/FLASH.*

      - name: Upload firmware artifacts (MAiXDUiNO_K210)
        uses: actions/upload-artifact@v4
        with:
          name: maixduino-k210-firmware
          path: Ports/Targets/MAiXDUiNO_K210/Variant_Test/System/FLASH.*

      - name: Upload firmware artifacts (Pico2_rp2350)
        uses: actions/upload-artifact@v4
        with:
          name: pico2-rp2350-firmware
          path: Ports/Targets/Pico2_rp2350/Variant_Test/System/FLASH.*


