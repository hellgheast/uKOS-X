name: uKOS-X CI
run-name: uKOS-X CI
on: [push]
permissions:
  contents: read
  packages: read
env:
  # Equivalent to CI_PROJECT_DIR in GitLab — set per-job via $GITHUB_WORKSPACE
  # PATH_GCC_CORTEXM: path inside the Docker image (symlink created by Dockerfile)
  PATH_GCC_ARM: /opt/uKOS/cross/gcc_arm
  PATH_GCC_RVXX: /opt/uKOS/cross/gcc_riscv
  IMAGE: ghcr.io/hellgheast/ukosx_tools:latest

jobs:

  login:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # ── Build: Alastor H743 ─────────────────────────────────────────────────────
  # Equivalent to build:alastor_743
  build-alastor-743:
    runs-on: ubuntu-latest
    needs: login
    container:
      image: ghcr.io/hellgheast/ukosx_tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      BOARD: Alastor_H743
      VARIANT: Variant_Test
    steps:

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build TinyUSB
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/TinyUSB"
          zsh build.sh

      - name: Build MicroPython
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/MicroPython"
          zsh build.sh

      - name: Build LVGL
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/LVGL"
          zsh build.sh

      - name: Build FatFs
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          cd "$PATH_UKOS_X_PACKAGE/Third_Parties/FatFs"
          zsh build.sh

      - name: Build firmware
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          export PATH="$PATH:$PATH_GCC_ARM/bin"
          make -C "$PATH_UKOS_X_PACKAGE/Ports/Targets/$BOARD/$VARIANT/System" \
               -j6 WITH_TINYUSB=n WITH_MICROPYTHON=n

      # Equivalent to GitLab artifacts: paths:
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alastor-h743-firmware
          path: |
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.elf
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.hex
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.bin
            Ports/Targets/${{ env.BOARD }}/${{ env.VARIANT }}/System/FLASH.map

  # ── Build: all targets ──────────────────────────────────────────────────────
  # Equivalent to build:build_all
  build-all:
    runs-on: ubuntu-latest
    needs: login
    container:
      image: ghcr.io/${{ github.repository_owner }}/ukosx_tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build all targets
        run: |
          export PATH_UKOS_X_PACKAGE="$GITHUB_WORKSPACE"
          export PATH="$PATH:$PATH_GCC_ARM/bin"
          cd "$PATH_UKOS_X_PACKAGE/Ports/Targets"
          ./build.sh -v


